<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#010202">
<title>Berichte</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Kaushan+Script&family=Sora:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header class="kopf" id="kopf"></header>
  <p class="hinweis" id="meldung" role="status"></p>

  <div class="raster">
    <aside class="liste-box" aria-label="Berichte des Azubis">
      <div class="neu">
        <label><span class="label">Azubi</span><select class="line-in" id="azubi"></select></label>
      </div>
      <div class="liste-kopf">
        <button class="mini" type="button" id="filter" aria-pressed="false">Nur zu unterschreiben</button>
        <span class="label" id="anzahl"></span>
      </div>
      <div class="liste" id="liste"></div>
    </aside>

    <main class="editor" id="editor">
      <div class="leer" id="leer">Wähle links einen Tag aus.</div>
      <section class="bogen" id="bogen" hidden>
        <div class="meta">
          <span class="kw" id="m-kw"></span>
          <span id="m-bereich"></span>
          <span id="m-aw"></span>
          <span class="stand" id="m-art"></span>
        </div>

        <div class="block">
          <div class="block-kopf"><span class="label">Betriebliche Tätigkeiten</span><span class="label" id="h-betrieb"></span></div>
          <div class="lesen" id="t-betrieb"></div>
        </div>
        <div class="block" id="b-schule">
          <div class="block-kopf"><span class="label">Berufsschule</span><span class="label" id="h-schule"></span></div>
          <div class="lesen" id="t-schule"></div>
        </div>
        <div class="block" id="b-unterweisung">
          <span class="label">Unterweisungen und Schulungen</span>
          <div class="lesen" id="t-unterweisung"></div>
        </div>

        <div class="block">
          <span class="label">Stand</span>
          <p><span class="pill" id="p-status"></span></p>
          <p class="signatur" id="signatur"></p>
        </div>

        <div class="aktionen">
          <div><button class="btn" type="button" id="kopieren">Als Text kopieren</button></div>
          <div>
            <button class="btn prim" type="button" id="unterschreiben" hidden>Unterschreiben</button>
            <button class="btn gefahr" type="button" id="zurueck" hidden>Unterschrift zurückziehen</button>
          </div>
        </div>
      </section>
    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
<script src="ausbilder.js"></script>
</body>
</html>
