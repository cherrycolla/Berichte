<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#010202">
<title>Berichte</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Kaushan+Script&family=Sora:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app schmal">
  <div class="kopf-text">
    <h1 class="salty">Berichte</h1>
    <p class="script">Anmeldung</p>
  </div>

  <form class="bogen" id="login" autocomplete="on">
    <label class="block">
      <span class="label">E-Mail</span>
      <input class="line-in" id="email" name="email" type="email" inputmode="email" autocomplete="username" autocapitalize="none" required>
    </label>
    <label class="block">
      <span class="label">Passwort</span>
      <input class="line-in" id="passwort" name="password" type="password" autocomplete="current-password" required>
    </label>
    <p class="fehler" id="fehler" role="alert"></p>
    <button class="btn prim breit" type="submit" id="senden">Anmelden</button>
  </form>
  <p class="hinweis">Zugänge legt der Administrator an.</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
<script src="login.js"></script>
</body>
</html>
